server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;
    charset utf-8;

    # 1. Server Hardening (Helmet & OWASP Best Practices)
    server_tokens off;

    # Security Headers (always emitted on all status codes)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' mailto: tel: sms: https://wa.me;" always;
    add_header Cache-Control "no-cache, must-revalidate" always;

    # 2. Gzip & Compression for 100/100 Core Web Vitals
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/xml text/javascript application/json application/javascript application/x-javascript application/xml application/rss+xml application/atom+xml image/svg+xml font/woff font/woff2 application/manifest+json;

    # 3. Static Media Assets (Aggressive 1-Year Immutable Caching)
    location ~* \.(?:svg|png|jpg|jpeg|gif|ico|webp|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Static CSS & JavaScript
    location ~* \.(?:css|js)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # 4. Search Engine Directives & Sitemaps
    location = /robots.txt {
        default_type text/plain;
        access_log off;
        log_not_found off;
    }

    location = /sitemap.xml {
        default_type application/xml;
        access_log off;
        log_not_found off;
    }

    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 1w;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }

    # 5. Block Access to Hidden & Sensitive Files (.git, .env, etc.)
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    # 6. Legacy 301 Redirects to Preserve Google Search Console Page 1 Ranks
    location ~* ^/(?:laptop|macbook|lenovo|dell|hp|asus|acer|msi|razer)-screen-replacement/?$ {
        return 301 /macbook-laptop-screen-replacement-brisbane.html;
    }
    location ~* ^/(?:screen-replacement|laptop-screen-repairs|laptop-screen-replacement-brisbane)/?$ {
        return 301 /macbook-laptop-screen-replacement-brisbane.html;
    }
    location ~* ^/(?:gaming-pc-repairs|gaming-laptop-repairs|gaming-computer-repairs)/?$ {
        return 301 /gaming-computer-repairs-brisbane.html;
    }
    location ~* ^/(?:bank-clearance-report|bank-clearance|unfreeze-bank-account|frozen-bank-account-report|virus-removal|malware-removal|scam-recovery|cyber-security-check|digital-security-check)/?$ {
        return 301 /digital-security-check-virus-removal-brisbane.html;
    }
    location ~* ^/(?:liquid-damage|liquid-damage-repair|liquid-damaged-laptop-repair|spill-damage-laptop-repairs|water-damaged-mac-repair|water-damage-macbook|ultrasonic-cleaning|logic-board-repair|macbook-water-damage|spill-damaged-laptop-repair)/?$ {
        return 301 /liquid-damage-laptop-repair-brisbane.html;
    }
    location ~* ^/(?:data-recovery|hard-drive-recovery|hard-drive-data-recovery|ssd-recovery|ssd-data-recovery|clicking-hard-drive-repair|external-drive-recovery|raid-recovery|forensic-data-recovery)/?$ {
        return 301 /hard-drive-ssd-data-recovery-brisbane.html;
    }
    location ~* ^/(?:dell|hp)-trackpad-replacement/?$ {
        return 301 /#services;
    }
    location ~* ^/(?:dell|msi|asus|hp|lenovo)-hinge-repairs/?$ {
        return 301 /#services;
    }
    location ~* ^/(?:hp|msi|asus|dell)-bricked-bios-fix/?$ {
        return 301 /#services;
    }
    location ~* ^/(?:laptop-fan-replacement|gaming-laptop-fan-replacement|hp-noisy-fan-repair|asus-noisy-fan-repair)/?$ {
        return 301 /#services;
    }
    location ~* ^/(?:dc-jack-repair|hp-charging-repair|visual-glitch-repair|power-supply-replacement)/?$ {
        return 301 /#services;
    }

    # 7. HTML Entry & Dynamic Revalidation (Instant deployment, zero stale HTML)
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    # 8. Error Pages
    error_page 404 /404.html;
    location = /404.html {
    }
}
