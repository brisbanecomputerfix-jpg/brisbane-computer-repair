<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0071e3"/>
      <stop offset="100%" stop-color="#0056b3"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- High-Contrast Outer White Keyline (Pops on Dark Browser Tabs) -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.9"/>

  <!-- Core Vibrant Apple Blue Squircle (Pops on Light Browser Tabs) -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#favBg)"/>

  <!-- Crisp White Laptop Display Chassis -->
  <rect x="13" y="12" width="38" height="26" rx="3.5" fill="#ffffff" filter="url(#glow)"/>
  
  <!-- Screen Interior (Deep Tech Contrast) -->
  <rect x="16" y="15" width="32" height="20" rx="2" fill="#0b1523"/>

  <!-- Glowing Emerald Green Repair Checkmark -->
  <path d="M24 25l4.5 4.5 11-10.5" stroke="#22c55e" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Laptop Base with Trackpad Notch -->
  <path d="M8 41h48c1.1 0 2 .9 2 2v1c0 1.1-.9 2-2 2H8c-1.1 0-2-.9-2-2v-1c0-1.1.9-2 2-2z" fill="#ffffff"/>
  <rect x="27" y="41" width="10" height="2.5" rx="1.2" fill="#94a3b8"/>
</svg>