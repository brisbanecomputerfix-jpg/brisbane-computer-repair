<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1523"/>
      <stop offset="60%" stop-color="#121e31"/>
      <stop offset="100%" stop-color="#1a2d47"/>
    </linearGradient>
    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0071e3" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#34c759" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34c759"/>
      <stop offset="100%" stop-color="#248a3d"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Ambient Glow Circles -->
  <circle cx="1050" cy="120" r="320" fill="url(#accentGlow)"/>
  <circle cx="120" cy="540" r="260" fill="url(#accentGlow)"/>

  <!-- Decorative Border -->
  <rect x="24" y="24" width="1152" height="582" rx="28" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="2"/>

  <!-- Top Navigation / Brand Tagline -->
  <g transform="translate(80, 75)">
    <!-- Logo Symbol -->
    <rect width="56" height="56" rx="14" fill="#0071e3"/>
    <rect x="12" y="12" width="32" height="21" rx="2.5" fill="#ffffff"/>
    <path d="M22 23l4 4 7-7" stroke="#34c759" stroke-width="3.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="9" y="36" width="38" height="5" rx="2.5" fill="#ffffff"/>

    <text x="74" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
      Brisbane Computer Repair
    </text>
    <text x="74" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#94a3b8">
      brisbanecomputerrepair.au • Trading as Computer Repair 1 (ABN 98 288 669 674)
    </text>
  </g>

  <!-- Rating Pill Badge -->
  <g transform="translate(850, 75)">
    <rect width="270" height="56" rx="28" fill="rgba(255, 255, 255, 0.06)" stroke="rgba(255, 255, 255, 0.12)" stroke-width="1.5"/>
    <text x="32" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700" fill="#ffb703">
      ★ 4.9 / 5.0
    </text>
    <text x="135" y="35" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#cbd5e1">
      (218+ Reviews)
    </text>
  </g>

  <!-- Main Hero Message -->
  <g transform="translate(80, 205)">
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#ffffff" letter-spacing="-1.5">
      Apple-Grade Computer Repair
    </text>
    <text x="0" y="112" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="#38bdf8" letter-spacing="-1.5">
      That Comes Directly to You.
    </text>
    <text x="0" y="162" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="500" fill="#cbd5e1">
      Fast on-site PC &amp; Mac hardware fixes, screen replacements &amp; bank scam clearance.
    </text>
  </g>

  <!-- Feature Value Pills -->
  <g transform="translate(80, 410)">
    <!-- Pill 1: Fixed Fee -->
    <g transform="translate(0, 0)">
      <rect width="240" height="50" rx="16" fill="rgba(0, 113, 227, 0.15)" stroke="#0071e3" stroke-width="1.5"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#60a5fa">
        ⚡ Flat $150–$170 Fee
      </text>
    </g>

    <!-- Pill 2: Zero Call Out -->
    <g transform="translate(255, 0)">
      <rect width="230" height="50" rx="16" fill="rgba(52, 199, 89, 0.15)" stroke="#34c759" stroke-width="1.5"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#4ade80">
        🚗 Zero Call-Out Fee
      </text>
    </g>

    <!-- Pill 3: Bank Reports -->
    <g transform="translate(500, 0)">
      <rect width="280" height="50" rx="16" fill="rgba(255, 149, 0, 0.15)" stroke="#ff9500" stroke-width="1.5"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="700" fill="#fbbf24">
        🛡️ Bank Fraud Clearance
      </text>
    </g>

    <!-- Pill 4: Hours -->
    <g transform="translate(795, 0)">
      <rect width="245" height="50" rx="16" fill="rgba(255, 255, 255, 0.08)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
      <text x="24" y="32" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="600" fill="#f1f5f9">
        🕒 8am – 8pm Everyday
      </text>
    </g>
  </g>

  <!-- Bottom CTA Banner -->
  <g transform="translate(80, 500)">
    <!-- Direct Call Button -->
    <g filter="url(#shadow)">
      <rect width="360" height="66" rx="20" fill="url(#btnGrad)"/>
      <text x="38" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#ffffff" letter-spacing="0.5">
        📞 Call 0468 991 300
      </text>
    </g>

    <text x="390" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" fill="#94a3b8">
      Senior-friendly, respectful service • Brisbane Metro on-site support
    </text>
  </g>
</svg>
